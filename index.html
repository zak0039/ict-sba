    <!DOCTYPE html>

<body>
    <div class="page-layout">
        <!-- 左側標題區域 -->
        <div class="info-section">
            <h1>Account Login</h1>
            <p>Access your dashboard and manage tasks</p>
        </div>

        <!-- 右側白色表單卡片 -->
        <div class="form-card">
            <h2 class="form-title">Sign In</h2>
            <forma action="/login.php">
                <div class="input-group">
                    <label for="email">login id</label>
                    <input type="text" id="email" required placeholder="your id" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="enter your password here" required>
                </div>

                <div class="options-group">
                    <label class="checkbox-container">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn">Log In</button>
            </form>
        </div>
    </div>
